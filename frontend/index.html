<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const DAYS = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
const HOLIDAYS = ['토요일', '일요일'];
const HOURS = Array.from({ length: 24 }, (_, i) => i);
const DEPTS = ['감사', '안전', 'ICT', '경영지원', '발전', '전기', '기계'];
const DEPT_COLOR = {
  감사: '#a78bfa', 안전: '#facc15', ICT: '#22e5ff', 경영지원: '#60a5fa',
  발전: '#ff2bd6', 전기: '#fb923c', 기계: '#94a3b8',
};
const HOLIDAY_COLOR = '#ff6b9d';
const WORK_START = 8, WORK_END = 19; // 캘린더에서 항상 펼쳐 보여줄 주간 시간대

// 자정을 넘는 업무는 end > 24 로 다룬다 (예: 22시~익일 06시 = start 22, end 30)
const hhmm = (h) => `${String(h).padStart(2, '0')}:00`;
const fmtEnd = (end) => (end > 24 ? `익일 ${hhmm(end - 24)}` : hhmm(end));
const fmtRange = (t) => `${hhmm(t.start)}–${fmtEnd(t.end)}`;
const isHoliday = (day) => HOLIDAYS.includes(day);
const isNight = (t) => t.start < 6 || t.end > 22; // 22~06시와 겹치면 야간
const hourBand = (h) => (h >= 22 || h < 6 ? 'night' : h >= 18 ? 'evening' : 'day');

// 주 단위 절대 시간 (월 00시 = 0)
const absRange = (t) => { const b = DAYS.indexOf(t.day) * 24; return [b + t.start, b + t.end]; };

// 두 업무가 실제로 겹치는 구간: 정렬용 절대 시작(s), 요일, 시간 문자열
function overlapInfo(a, b) {
  const [as, ae] = absRange(a), [bs, be] = absRange(b);
  const s = Math.max(as, bs), e = Math.min(ae, be);
  const sd = Math.floor(s / 24), ed = Math.floor((e - 1) / 24);
  const day = DAYS[sd % 7];
  const time = `${hhmm(s % 24)}–${ed > sd ? '익일 ' : ''}${hhmm(e - ed * 24)}`;
  const night = isNight({ start: s % 24, end: s % 24 + e - s });
  return { s, day, time, night };
}

function heat(tasks) {
  const ranges = tasks.map((t) => [t, ...absRange(t)]);
  return DAYS.map((day, di) =>
    HOURS.map((h) => {
      const x = di * 24 + h;
      const active = ranges.filter(([, s, e]) => s <= x && x < e).map(([t]) => t);
      const conflict = active.some((t) => active.some((o) => t.conflictWith.includes(o.id)));
      return { day, h, active, conflict };
    })
  );
}

function cellStyle(c) {
  if (c.conflict) return { background: '#b0002a', borderColor: '#ff2e55' };
  const n = c.active.length;
  if (n === 0) return { background: hourBand(c.h) === 'night' ? 'rgba(43,255,136,.10)' : 'rgba(43,255,136,.20)', borderColor: 'rgba(43,255,136,.25)' };
  if (n === 1) return { background: 'rgba(43,255,136,.45)', borderColor: 'rgba(43,255,136,.6)' };
  if (n === 2) return { background: 'rgba(255,176,32,.55)', borderColor: 'rgba(255,176,32,.8)' };
  return { background: 'rgba(255,46,85,.75)', borderColor: '#ff2e55' };
}

// ---------- API ----------
async function fetchAnalysis(tasks) {
  const res = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(tasks ? { tasks } : {}),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ---------- 컴포넌트 ----------
function Header({ data, stats, loading, onAnalyze, onEdit }) {

    <header className="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6">

        <h1 className="font-display font-black text-3xl md:text-4xl text-white glow-text tracking-wider">
          WORK<span className="text-neon-cyan">SYNC</span>
          <span className="ml-3 text-base md:text-lg font-sans font-bold text-slate-300 tracking-normal">주간업무 현황판</span>
        </h1>
        <p className="mt-2 text-sm text-slate-400 max-w-2xl">{data?.summary ?? '주간업무 데이터를 분석하고 있습니다…'}</p>
      </div>
      <div className="flex flex-wrap items-center gap-3">
        <Stat label="TOTAL" value={stats.total} color="text-neon-cyan" />
        <Stat label="야간·휴일" value={stats.offHours} color="text-indigo-300" />
        <Stat label="CONFLICT" value={stats.conflicts} color="text-neon-red" pulse={stats.conflicts > 0} />

}

    </div>

// 충돌 쌍을 한 번씩만 뽑는다
function conflictPairs(tasks) {
  const byId = Object.fromEntries(tasks.map((t) => [t.id, t]));
  const seen = new Set();
  const pairs = [];
  tasks.forEach((t) => {
    if (!t.isConflict) return;
    t.conflictWith.forEach((id) => {
      const key = [t.id, id].sort().join('|');
      if (seen.has(key) || !byId[id]) return;
      seen.add(key);
      pairs.push([t, byId[id]]);
    });
  });
  return pairs.sort((a, b) => absRange(a[0])[0] - absRange(b[0])[0]);
}

// ---------- 주간 캘린더 ----------
const SLOT = 56, FOLD = 12; // 업무가 있는 시간 / 비어 있는 야간 시간(접힘)의 높이(px)

// 자정을 넘는 업무를 요일별 조각으로 나눈다
function segments(tasks) {
  return tasks.flatMap((t) => {
    if (t.end <= 24) return [{ ...t, key: t.id, span: t }];
    const di = DAYS.indexOf(t.day);
    const segs = [{ ...t, key: t.id + 'a', end: 24, span: t, cont: 'next' }];
    if (di + 1 < DAYS.length) segs.push({ ...t, key: t.id + 'b', day: DAYS[di + 1], start: 0, end: t.end - 24, span: t, cont: 'prev' });
    return segs;
  });
}

// 같은 날 시간이 겹치는 업무끼리 묶어 나란히 놓을 열(lane)을 정한다
function assignLanes(list) {
  const sorted = [...list].sort((a, b) => a.start - b.start || b.end - a.end);
  const out = [];
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const n = Math.max(...cluster.map((c) => c.lane)) + 1;
    cluster.forEach((c) => out.push({ ...c, lanes: n }));
    cluster = []; clusterEnd = -1;
  };
  sorted.forEach((t) => {
    if (cluster.length && t.start >= clusterEnd) flush();
    const laneEnds = [];
    cluster.forEach((c) => { laneEnds[c.lane] = Math.max(laneEnds[c.lane] ?? 0, c.task.end); });
    let lane = laneEnds.findIndex((e) => e <= t.start);
    if (lane === -1) lane = laneEnds.length;
    cluster.push({ task: t, lane });
    clusterEnd = Math.max(clusterEnd, t.end);
  });
  if (cluster.length) flush();
  return out;
}

function EventBlock({ s, lane, lanes, ys, hover, setHover, onOpen }) {
  const t = s.span;
  const color = DEPT_COLOR[s.dept] ?? '#22e5ff';
  const lit = hover && (hover === s.id || s.conflictWith.includes(hover));
  const height = ys[s.end] - ys[s.start] - 4;
  const style = {
    top: ys[s.start] + 2, height,
    left: `calc(${(lane / lanes) * 100}% + 3px)`,
    width: `calc(${100 / lanes}% - 6px)`,
    background: s.isConflict
      ? 'repeating-linear-gradient(135deg, rgba(255,46,85,.32) 0 8px, rgba(255,46,85,.20) 8px 16px)'
      : s.movedFrom ? 'rgba(43,255,136,.18)' : `${color}2e`,
    borderLeft: `4px solid ${s.isConflict ? '#ff2e55' : s.movedFrom ? '#2bff88' : color}`,
  };
  return (
    <div style={style} title={`[${s.dept}] ${s.title}\n${t.day} ${fmtRange(t)}`}
      onMouseEnter={() => setHover(s.id)} onMouseLeave={() => setHover(null)}
      onClick={() => s.isConflict && onOpen(t)}
      className={`absolute overflow-hidden px-2 py-1 transition-all
        ${s.isConflict ? 'cursor-pointer outline outline-1 outline-neon-red/70 shadow-[0_0_14px_rgba(255,46,85,.45)]' : ''}
        ${lit ? 'z-10 ring-2 ring-white/90 brightness-125' : ''}`}>
      <div className="flex items-center gap-1 text-[11px] leading-tight flex-wrap">
        <span className="px-1 font-bold text-void shrink-0" style={{ background: s.isConflict ? '#ff2e55' : color }}>{s.dept}</span>
        {height > 70 && <OffTags t={t} day={s.day} />}
        {s.isConflict && <span className="ml-auto shrink-0 w-2 h-2 rounded-full bg-neon-red animate-ping" />}
      </div>
      <div className="text-[13px] font-semibold text-white leading-snug mt-0.5 line-clamp-2 break-keep">{s.title}</div>
      <div className={`font-mono text-[10.5px] truncate ${s.cont ? 'text-indigo-300' : 'text-slate-300'}`}>
        {s.cont === 'prev' ? `↑ 전일 ${hhmm(t.start)}부터` : s.cont === 'next' ? `${hhmm(t.start)} ↓ 익일 계속` : fmtRange(t)}

    </div>
  );
}

function Calendar({ tasks, hover, setHover, onOpen, onClose, engine }) {
  const [hidden, setHidden] = useState([]);
  const visible = tasks.filter((t) => !hidden.includes(t.dept));
  const toggle = (d) => setHidden((h) => (h.includes(d) ? h.filter((x) => x !== d) : [...h, d]));
  const segs = segments(visible);

  // 주간 시간대와 업무가 있는 시간은 펼치고, 빈 야간 시간은 얇게 접는다
  const heights = HOURS.map((h) => ((h >= WORK_START && h < WORK_END) || segs.some((s) => s.start <= h && h < s.end) ? SLOT : FOLD));
  const ys = heights.reduce((acc, v) => [...acc, acc[acc.length - 1] + v], [0]);
  const total = ys[24];

  return (

        </div>
      </div>

      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={() => setHidden([])}
          className={`px-3 py-1 text-xs border transition ${hidden.length ? 'border-slate-600 text-slate-400' : 'border-neon-cyan text-neon-cyan bg-neon-cyan/10'}`}>
          전체 부서
        </button>
        {DEPTS.map((d) => {
          const on = !hidden.includes(d);
          const n = tasks.filter((t) => t.dept === d).length;
          const bad = tasks.some((t) => t.dept === d && t.isConflict);
          return (
            <button key={d} onClick={() => toggle(d)}
              className={`px-3 py-1 text-xs font-bold border transition flex items-center gap-1.5 ${on ? '' : 'opacity-35 line-through'}`}
              style={{ borderColor: DEPT_COLOR[d], color: on ? '#05060d' : DEPT_COLOR[d], background: on ? DEPT_COLOR[d] : 'transparent' }}>
              {d} <span className="font-mono font-normal">{n}</span>
              {bad && <span className="w-1.5 h-1.5 rounded-full bg-neon-red ring-1 ring-black" />}
            </button>
          );
        })}
      </div>

      <div className="overflow-x-auto">
        <div className="min-w-[1100px]">
          <div className="grid" style={{ gridTemplateColumns: `60px repeat(${DAYS.length}, 1fr)` }}>
            <div />
            {DAYS.map((d) => {
              const list = segs.filter((s) => s.day === d);
              const bad = list.filter((s) => s.isConflict).length;
              const hol = isHoliday(d);
              return (
                <div key={d} className="px-1 pb-2 flex flex-wrap items-baseline justify-center gap-x-2">
                  <span className="font-display text-sm tracking-wider" style={{ color: hol ? HOLIDAY_COLOR : '#22e5ff' }}>{d}</span>
                  {hol && <span className="text-[10px] font-bold px-1 text-void" style={{ background: HOLIDAY_COLOR }}>휴일</span>}
                  <span className="font-mono text-[11px] text-slate-500">{list.length}건</span>
                  {bad > 0 && <span className="text-[10px] font-bold px-1.5 bg-neon-red text-white">충돌 {bad}</span>}
                </div>
              );
            })}
          </div>

          <div className="grid border-t border-neon-cyan/20" style={{ gridTemplateColumns: `60px repeat(${DAYS.length}, 1fr)` }}>
            <div className="relative" style={{ height: total }}>
              {HOURS.map((h) => heights[h] === SLOT && (
                <div key={h} className={`absolute right-2 font-mono text-[11px] -translate-y-1/2 ${hourBand(h) === 'night' ? 'text-indigo-300' : 'text-slate-500'}`} style={{ top: Math.max(ys[h], 7) }}>
                  {hourBand(h) === 'night' ? '🌙' : ''}{hhmm(h)}
                </div>
              ))}
            </div>
            {DAYS.map((d) => (
              <div key={d} className="relative border-l border-neon-cyan/15"
                style={{ height: total, background: isHoliday(d) ? `${HOLIDAY_COLOR}0f` : 'rgba(255,255,255,.015)' }}>

                  const band = hourBand(h);
                  return (
                    <div key={h} className={`absolute inset-x-0 border-t ${heights[h] === SLOT ? 'border-white/[.07]' : 'border-transparent'}`}
                      style={{ top: ys[h], height: heights[h], background: band === 'night' ? 'rgba(99,102,241,.10)' : band === 'evening' ? 'rgba(255,176,32,.035)' : undefined }}>
                      {h === 12 && <span className="absolute right-1 top-0.5 text-[10px] text-neon-pink/50">점심</span>}
                    </div>
                  );
                })}
                {assignLanes(segs.filter((s) => s.day === d)).map(({ task, lane, lanes }) => (
                  <EventBlock key={task.key} s={task} lane={lane} lanes={lanes} ys={ys} hover={hover} setHover={setHover} onOpen={onOpen} />

          </div>

        </div>
      </div>
    </div>
  );
}

function useTyping(text, speed = 18) {
  const [out, setOut] = useState('');
  useEffect(() => {
    setOut('');
    let i = 0;
    const id = setInterval(() => {
      i += 1;
      setOut(text.slice(0, i));
      if (i >= text.length) clearInterval(id);
    }, speed);
    return () => clearInterval(id);
  }, [text]);
  return out;
}

          </div>
          <div className="flex items-center gap-3">
            <span className={`${sev[1]} text-void font-display text-[10px] font-bold px-2 py-1 tracking-widest`}>{sev[0]}</span>
            <button onClick={onClose} className="text-slate-400 hover:text-white text-xl leading-none" aria-label="닫기">✕</button>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] items-center gap-3 mb-5">
          {pair.slice(0, 2).map((t, i) => (
            <React.Fragment key={t.id}>
              {i === 1 && <div className="text-center font-display text-neon-red text-lg animate-pulse">⇄</div>}
              <div className="border border-neon-red/40 bg-neon-red/5 p-3">
                <div className="flex items-center gap-1.5 text-xs font-bold" style={{ color: DEPT_COLOR[t.dept] }}>{t.dept} <OffTags t={t} /></div>
                <div className="text-white font-medium">{t.title}</div>
                <div className="font-mono text-xs text-slate-400 mt-1">{t.day} {fmtRange(t)}</div>
              </div>
            </React.Fragment>
          ))}
        </div>

        <section className="mb-4">
          <div className="font-mono text-[11px] text-neon-red tracking-widest mb-1">&gt; 충돌 사유</div>
          <p className="text-slate-200 text-sm leading-relaxed border-l-2 border-neon-red pl-3">{task.reason}</p>
        </section>

        <section className="mb-6">
          <div className="font-mono text-[11px] text-neon-green tracking-widest mb-1">&gt; AI 일정 조정 제안</div>
          <div className="bg-black/40 border border-neon-green/30 p-3">
            {mover && (
              <div className="text-xs text-neon-green mb-2">
                {mover.title}: {mover.day} → <span className="font-bold text-white">{mover.suggestedDay}</span> ({fmtRange(mover)})
              </div>
            )}
            <p className={`text-sm text-slate-200 leading-relaxed ${typed.length < (task.suggestion || '').length ? 'cursor' : ''}`}>{typed}</p>
          </div>
        </section>

        <div className="flex flex-col sm:flex-row gap-3 justify-end">
          <button onClick={onClose} className="px-4 py-2 border border-slate-600 text-slate-300 hover:border-slate-400 text-sm">나중에</button>
          <button onClick={() => onApply(pair.map((t) => t.id), mover)} disabled={!mover}
            className="px-5 py-2 bg-neon-green text-void text-sm font-bold hover:shadow-[0_0_20px_#2bff88] transition disabled:opacity-40">
            ✓ AI 제안 적용
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- 업무 입력 ----------
const PRESETS = [['오전', 9, 12], ['오후', 13, 18], ['종일', 9, 18], ['연장', 18, 22], ['🌙 야간', 22, 30]];
const BLANK = { dept: DEPTS[0], title: '', day: DAYS[0], start: 9, end: 10 };

// 엑셀에서 복사한 줄(탭 구분) 또는 쉼표 구분 텍스트: 부서, 업무, 요일, 22:00-06:00
function parsePaste(text) {
  return text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((line) => {
    const [dept, title, day, time] = line.split(/\t|,/).map((s) => s.trim());
    const d = DAYS.find((x) => day && x.startsWith(day.slice(0, 1)));
    const m = (time || '').match(/(\d{1,2})(?::\d{2})?\s*[-~]\s*(\d{1,2})/);
    if (!dept || !title || !d) return null;
    const start = m ? +m[1] : 9;
    let end = m ? +m[2] : 18;
    if (end <= start) end += 24; // 자정을 넘는 야간 작업
    return { dept, title, day: d, start, end };
  }).filter(Boolean);
}

function Chip({ on, color, onClick, children }) {
  return (
    <button type="button" onClick={onClick}
      className="px-3 py-1.5 text-sm font-bold border transition"
      style={{ borderColor: color, color: on ? '#05060d' : color, background: on ? color : 'transparent' }}>
      {children}
    </button>
  );
}

function TaskEditor({ tasks, onClose, onSubmit }) {
  const [items, setItems] = useState(() => tasks.map(({ dept, title, day, start, end }) => ({ dept, title, day, start, end })));
  const [form, setForm] = useState(BLANK);
  const [editIdx, setEditIdx] = useState(null);
  const [err, setErr] = useState('');
  const [paste, setPaste] = useState('');
  const [showPaste, setShowPaste] = useState(false);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const setStart = (s) => setForm((f) => ({ ...f, start: s, end: f.end > s && f.end <= s + 24 ? f.end : s + 1 }));

  const save = () => {
    if (!form.title.trim()) return setErr('업무명을 입력하세요');
    const item = { ...form, title: form.title.trim() };
    setItems((list) => (editIdx === null ? [...list, item] : list.map((x, i) => (i === editIdx ? item : x))));
    setForm({ ...BLANK, dept: form.dept, day: form.day }); // 같은 부서·요일 연속 입력이 편하도록 유지
    setEditIdx(null); setErr('');
  };

  const edit = (i) => { setForm(items[i]); setEditIdx(i); setErr(''); };
  const remove = (i) => { setItems((list) => list.filter((_, j) => j !== i)); if (editIdx === i) { setEditIdx(null); setForm(BLANK); } };
  const importPaste = () => {
    const rows = parsePaste(paste);
    if (!rows.length) return setErr('붙여넣은 내용에서 업무를 찾지 못했습니다 (부서, 업무, 요일, 시간 순서)');
    setItems((list) => [...list, ...rows]); setPaste(''); setShowPaste(false); setErr('');
  };

  const order = items.map((t, i) => ({ t, i })).sort((a, b) => absRange(a.t)[0] - absRange(b.t)[0]);
  const endOpts = Array.from({ length: 24 }, (_, i) => form.start + 1 + i);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/70 backdrop-blur-sm" onClick={onClose}>
      <div className="panel modal-in w-full max-w-4xl max-h-[94vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
        <div className="p-5 border-b border-neon-cyan/15 flex justify-between items-start">
          <div>
            <h3 className="font-display text-lg text-white">주간업무 입력</h3>
            <p className="text-xs text-slate-400 mt-1">부서 · 업무 · 요일 · 시간을 고르고 [추가]를 누르세요. 야간(자정 넘김)·휴일 작업도 입력할 수 있습니다.</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-xl leading-none" aria-label="닫기">✕</button>
        </div>

        <div className="overflow-y-auto p-5 space-y-5">
          <section className={`border p-4 space-y-4 ${editIdx !== null ? 'border-neon-amber/60 bg-neon-amber/5' : 'border-neon-cyan/25 bg-neon-cyan/[.03]'}`}>
            <div className="font-mono text-[11px] tracking-widest text-neon-cyan">{editIdx !== null ? '✎ 업무 수정' : '+ 새 업무'}</div>

            <div>
              <label className="block text-xs text-slate-400 mb-1.5">부서</label>
              <div className="flex flex-wrap gap-2">
                {DEPTS.map((d) => <Chip key={d} on={form.dept === d} color={DEPT_COLOR[d]} onClick={() => set('dept', d)}>{d}</Chip>)}
              </div>
            </div>

            <div>
              <label className="block text-xs text-slate-400 mb-1.5">업무명</label>
              <input value={form.title} onChange={(e) => set('title', e.target.value)} autoFocus
                onKeyDown={(e) => e.key === 'Enter' && !e.nativeEvent.isComposing && save()}
                placeholder="예: 전산망 서버 점검"
                className="w-full bg-black/50 border border-neon-cyan/30 focus:border-neon-cyan outline-none px-3 py-2 text-white placeholder:text-slate-600" />
            </div>

            <div className="flex flex-wrap gap-6">
              <div>
                <label className="block text-xs text-slate-400 mb-1.5">요일 <span className="text-slate-600">(토·일 = 휴일)</span></label>
                <div className="flex gap-1.5">
                  {DAYS.map((d) => (
                    <Chip key={d} on={form.day === d} color={isHoliday(d) ? HOLIDAY_COLOR : '#22e5ff'} onClick={() => set('day', d)}>{d.slice(0, 1)}</Chip>
                  ))}
                </div>
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1.5">시간</label>
                <div className="flex flex-wrap items-center gap-2">
                  <select value={form.start} onChange={(e) => setStart(+e.target.value)}
                    className="bg-black/50 border border-neon-cyan/30 text-white px-2 py-1.5 font-mono text-sm outline-none focus:border-neon-cyan">
                    {HOURS.map((h) => <option key={h} value={h}>{hhmm(h)}</option>)}
                  </select>
                  <span className="text-slate-500">~</span>
                  <select value={form.end} onChange={(e) => set('end', +e.target.value)}
                    className="bg-black/50 border border-neon-cyan/30 text-white px-2 py-1.5 font-mono text-sm outline-none focus:border-neon-cyan">
                    {endOpts.map((h) => <option key={h} value={h}>{fmtEnd(h)}</option>)}
                  </select>
                </div>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {PRESETS.map(([label, s, e]) => (
                    <button key={label} type="button" onClick={() => setForm((f) => ({ ...f, start: s, end: e }))}
                      className={`px-2 py-1 text-xs border ${form.start === s && form.end === e ? 'border-neon-pink text-neon-pink' : 'border-slate-600 text-slate-400 hover:text-white'}`}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {(isNight(form) || isHoliday(form.day)) && (
              <div className="flex items-center gap-2 text-xs text-indigo-200 bg-indigo-500/10 border border-indigo-400/30 px-3 py-2">
                <OffTags t={form} />
                {[isNight(form) && '야간', isHoliday(form.day) && '휴일'].filter(Boolean).join('·')} 작업으로 표시됩니다. 인력이 적은 시간대라 위험작업이 겹치면 충돌로 분석합니다.
              </div>
            )}

            {err && <div className="text-neon-red text-sm">{err}</div>}
            <div className="flex gap-2">
              <button onClick={save} className="px-5 py-2 bg-neon-cyan text-void font-bold text-sm hover:shadow-[0_0_16px_#22e5ff] transition">
                {editIdx !== null ? '수정 완료' : '+ 추가'}
              </button>
              {editIdx !== null && (
                <button onClick={() => { setEditIdx(null); setForm(BLANK); setErr(''); }} className="px-4 py-2 border border-slate-600 text-slate-300 text-sm">수정 취소</button>
              )}
              <button onClick={() => setShowPaste((v) => !v)} className="ml-auto px-3 py-2 text-xs border border-slate-600 text-slate-400 hover:text-white">
                📋 엑셀에서 붙여넣기
              </button>
            </div>

            {showPaste && (
              <div className="space-y-2">
                <p className="text-xs text-slate-400">엑셀에서 <b className="text-slate-200">부서 | 업무 | 요일 | 시간</b> 4개 열을 복사해 붙여넣으세요. 쉼표로 구분해도 되고, <b className="text-slate-200">22:00-06:00</b>처럼 쓰면 익일까지 이어지는 야간 작업이 됩니다.</p>
                <textarea value={paste} onChange={(e) => setPaste(e.target.value)} spellCheck={false}
                  placeholder={'ICT\t전산망 서버 점검\t수\t09:00-13:00\n전기, 송전선로 절체, 목요일, 22:00-04:00\n기계, 냉각수 펌프 정비, 토, 13-17'}
                  className="w-full h-28 bg-black/50 border border-neon-cyan/30 text-neon-cyan font-mono text-xs p-3 outline-none focus:border-neon-cyan" />
                <button onClick={importPaste} className="px-4 py-1.5 border border-neon-cyan text-neon-cyan text-xs">불러오기</button>
              </div>
            )}
          </section>

          <section>
            <div className="flex items-center justify-between mb-2">
              <div className="text-sm text-slate-200 font-bold">입력된 업무 <span className="text-neon-cyan">{items.length}</span>건</div>
              {items.length > 0 && (
                <button onClick={() => { if (confirm('입력된 업무를 모두 지울까요?')) { setItems([]); setEditIdx(null); } }}
                  className="text-xs text-slate-500 hover:text-neon-red">전체 비우기</button>
              )}
            </div>
            {items.length === 0 ? (
              <div className="text-center text-slate-500 text-sm py-8 border border-dashed border-slate-700">아직 입력된 업무가 없습니다</div>
            ) : (
              <div className="border border-white/10 divide-y divide-white/5">
                {order.map(({ t, i }) => (
                  <div key={i} className={`flex items-center gap-3 px-3 py-2 text-sm ${editIdx === i ? 'bg-neon-amber/10' : 'hover:bg-white/[.03]'}`}>
                    <span className="w-6 text-center font-bold" style={{ color: isHoliday(t.day) ? HOLIDAY_COLOR : '#22e5ff' }}>{t.day.slice(0, 1)}</span>
                    <span className="w-36 font-mono text-xs text-slate-400">{fmtRange(t)}</span>
                    <span className="w-16 shrink-0 text-center px-1 text-xs font-bold text-void" style={{ background: DEPT_COLOR[t.dept] ?? '#94a3b8' }}>{t.dept}</span>
                    <span className="flex-1 text-slate-100 truncate">{t.title}</span>
                    <span className="flex gap-1"><OffTags t={t} /></span>
                    <button onClick={() => edit(i)} className="text-xs px-2 py-1 border border-slate-600 text-slate-300 hover:border-neon-amber hover:text-neon-amber">수정</button>
                    <button onClick={() => remove(i)} className="text-xs px-2 py-1 border border-slate-600 text-slate-300 hover:border-neon-red hover:text-neon-red">삭제</button>
                  </div>
                ))}
              </div>
            )}
          </section>
        </div>

        <div className="p-4 border-t border-neon-cyan/15 flex justify-end gap-3">
          <button onClick={onClose} className="px-4 py-2 border border-slate-600 text-slate-300 text-sm">취소</button>
          <button onClick={() => onSubmit(toInput(items))} disabled={!items.length}
            className="px-6 py-2 bg-neon-pink text-void font-bold text-sm hover:shadow-[0_0_18px_#ff2bd6] transition disabled:opacity-40">
            ▶ AI 분석 ({items.length}건)
          </button>
        </div>
      </div>
    </div>
  );
}

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 modal-in panel px-5 py-3 text-sm text-neon-green border-neon-green/50 max-w-[90vw]">
      {msg}
    </div>
  );
}

function toInput(tasks) {
  return tasks.map((t) => ({
    부서: t.dept, 업무: t.title, 날짜: t.day,
    시간: `${hhmm(t.start)}-${hhmm(t.end > 24 ? t.end - 24 : t.end)}`,
  }));
}

function App() {
  const [data, setData] = useState(null);
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [hover, setHover] = useState(null);
  const [selected, setSelected] = useState(null);
  const [editing, setEditing] = useState(false);
  const [toast, setToast] = useState('');
  const [log, setLog] = useState([]); // 리스크 타임라인에 남길 조정 완료 기록
  const [showCalendar, setShowCalendar] = useState(false);

  const load = async (input) => {
    setLoading(true);
    setLog([]);
    try {
      const res = await fetchAnalysis(input);
      setData(res); setTasks(res.tasks);
    } catch (e) {
      const res = window.OFFLINE_DATA;
      if (res) { setData(res); setTasks(res.tasks); }
      flash('서버에 연결할 수 없어 오프라인 데모 데이터를 표시합니다');
    } finally { setLoading(false); }
  };

  useEffect(() => { load(); }, []);

  const flash = (m) => { setToast(m); setTimeout(() => setToast(''), 3200); };

  const applySuggestion = (ids, mover) => {
    const pair = tasks.filter((t) => ids.includes(t.id)).slice(0, 2);
    if (pair.length === 2) {
      setLog((l) => [...l, {
        kind: 'done', key: 'done' + ids.join(''), pair, ...overlapInfo(...pair),
        mover: mover && { title: mover.title, from: mover.day, to: mover.suggestedDay },
      }]);
    }
    setTasks((prev) => prev.map((t) => {
      if (!ids.includes(t.id)) return t;
      const moved = mover && t.id === mover.id;
      return { ...t, day: moved ? t.suggestedDay : t.day, movedFrom: moved ? t.day : t.movedFrom, isConflict: false, conflictWith: [] };
    }));
    setSelected(null);
    if (mover) flash(`✓ '${mover.title}' 일정을 ${mover.suggestedDay}로 이동했습니다`);
  };

  const stats = {
    total: tasks.length,
    offHours: tasks.filter((t) => isNight(t) || isHoliday(t.day)).length,
    conflicts: conflictPairs(tasks).length,
    resolved: tasks.filter((t) => t.movedFrom).length,
  };

  return (
    <div className="grid-bg min-h-screen">
      <div className="max-w-[1500px] mx-auto px-4 py-6 md:px-8">
        <Header data={data} stats={stats} loading={loading} onAnalyze={() => load(toInput(tasks))} onEdit={() => setEditing(true)} />
        <RiskTimeline tasks={tasks} log={log} setHover={setHover} onOpen={setSelected} onApply={applySuggestion} />
        {showCalendar
          ? <Calendar tasks={tasks} hover={hover} setHover={setHover} onOpen={setSelected} onClose={() => setShowCalendar(false)} engine={data?.engine} />
          : <CalendarToggle tasks={tasks} onOpen={() => setShowCalendar(true)} />}
        <Heatmap tasks={tasks} />

        <footer className="mt-6 font-mono text-[10px] text-slate-600 text-center tracking-widest">
          WORKSYNC v0.2 · AI SCHEDULE ORCHESTRATOR · {data?.engine ?? '---'}
        </footer>
      </div>

      {selected && <ConflictModal task={tasks.find((t) => t.id === selected.id) ?? selected} tasks={tasks} onClose={() => setSelected(null)} onApply={applySuggestion} />}
      {editing && <TaskEditor tasks={tasks} onClose={() => setEditing(false)} onSubmit={(v) => { setEditing(false); load(v); }} />}
      {loading && (
        <div className="fixed inset-0 z-40 flex items-center justify-center bg-void/70 backdrop-blur-sm">
          <div className="font-display text-neon-cyan tracking-[.4em] animate-pulse glow-text">AI SCANNING SCHEDULES…</div>
        </div>
      )}
      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
